<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><rect width="1200" height="850" fill="#f3f6fb"/><rect width="1200" height="78" fill="#10264a"/><text x="54" y="49" font-family="Arial" font-size="30" font-weight="bold" fill="#fff">CampusHelp</text><text x="1000" y="46" font-family="Arial" font-size="16" fill="#dce7ff">STUDENT PORTAL</text><text x="70" y="145" font-family="Arial" font-size="32" font-weight="bold" fill="#172b4d">Submit a service request</text><text x="70" y="180" font-family="Arial" font-size="18" fill="#61748a">Tell us what you need help with. Fields marked * are required.</text><rect x="70" y="220" width="700" height="570" rx="18" fill="#fff" stroke="#dce4ee"/><g font-family="Arial" fill="#172b4d" font-size="18" font-weight="bold"><text x="110" y="270">Student ID *</text><text x="110" y="365">Request category *</text><text x="110" y="460">Priority *</text><text x="110" y="555">Description *</text></g><g fill="#fff" stroke="#c6d2e1" stroke-width="2"><rect x="110" y="288" width="610" height="48" rx="8"/><rect x="110" y="383" width="610" height="48" rx="8"/><rect x="110" y="478" width="610" height="48" rx="8"/><rect x="110" y="573" width="610" height="110" rx="8"/></g><g font-family="Arial" font-size="17" fill="#7b8ba1"><text x="128" y="319">Enter your student ID</text><text x="128" y="414">Select a category</text><text x="128" y="509">Choose priority</text><text x="128" y="605">Describe the issue...</text></g><rect x="110" y="710" width="190" height="54" rx="9" fill="#2457d6"/><text x="145" y="744" font-family="Arial" font-size="18" font-weight="bold" fill="#fff">Submit request</text><rect x="810" y="220" width="320" height="570" rx="18" fill="#fff" stroke="#dce4ee"/><text x="845" y="270" font-family="Arial" font-size="22" font-weight="bold" fill="#172b4d">After submission</text><text x="845" y="315" font-family="Arial" font-size="17" fill="#61748a">A unique request ID will be</text><text x="845" y="340" font-family="Arial" font-size="17" fill="#61748a">displayed for tracking.</text><rect x="840" y="390" width="260" height="95" rx="12" fill="#edf3ff"/><text x="860" y="425" font-family="Arial" font-size="15" fill="#61748a">SAMPLE REQUEST ID</text><text x="860" y="460" font-family="Arial" font-size="25" font-weight="bold" fill="#2457d6">CH-1043</text><text x="845" y="540" font-family="Arial" font-size="18" font-weight="bold" fill="#172b4d">Track status</text><g font-family="Arial" font-size="16"><rect x="845" y="565" width="110" height="34" rx="17" fill="#fff2d7"/><text x="870" y="588" fill="#885b00">Open</text><rect x="845" y="615" width="150" height="34" rx="17" fill="#e6efff"/><text x="870" y="638" fill="#2457d6">In Progress</text><rect x="845" y="665" width="140" height="34" rx="17" fill="#e1f5e9"/><text x="870" y="688" fill="#18865b">Completed</text></g><text x="70" y="825" font-family="Arial" font-size="14" fill="#75869b">Academic prototype wireframe — sample data only; no production submission or email service.</text></svg>